name: ci

# Runs only on pull requests and pushes to main of a repository that does not exist yet. Nothing here publishes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is .nvmrc (the development version; a test keeps them equal). 24 is the release publish job's version
        # line, so the suite is proven on both.
        node: ['22', '24']
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/typescript/package-lock.json
      - name: Install the pinned CI tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/pip" install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          echo "$RUNNER_TEMP/ci/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      # Runtime tree only (viem and its dependencies). The dev-only advisory GHSA-82fw-gwwq-j7x9 in vitest 3.2.7's
      # @vitest/mocker is accepted until vitest 4 (docs/releasing.md, "Accepted advisories").
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:package
      - run: npm run format:check
      - run: node ../../scripts/gen-abis.mjs --verify-digest
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # ESM and CJS imports in fresh processes, then the built Python wheel in an isolated venv. Online (hash-checked) on a
      # fresh runner: CI=true selects it, and the explicit flag keeps it so if that default ever changes.
      - run: npm run smoke:dist
        env:
          MERCURIFI_SMOKE_ONLINE: '1'

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned CI tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/pip" install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          echo "$RUNNER_TEMP/ci/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run python scripts/check_pyproject.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install the pinned CI tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/pip" install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          echo "$RUNNER_TEMP/ci/bin" >> "$GITHUB_PATH"
      - run: node scripts/check-workflows.mjs
      - run: zizmor --min-severity medium .github/workflows
