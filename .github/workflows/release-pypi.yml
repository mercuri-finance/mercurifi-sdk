name: release-pypi

# Inert until the owner creates the repository, the PyPI pending publisher and the pypi-release environment with required
# reviewers. Manual dispatch only; the environment gate is the owner's approval for this specific publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository_owner == 'mercuri-finance' && github.actor == 'mercurifinance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi-release
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance; this job only
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned CI tools (hashed)
        run: |
          python3 -m venv "$RUNNER_TEMP/ci"
          "$RUNNER_TEMP/ci/bin/pip" install --require-hashes --no-deps -r "$GITHUB_WORKSPACE/.github/ci-requirements.txt"
          echo "$RUNNER_TEMP/ci/bin" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run python scripts/check_pyproject.py && uv run ruff check . && uv run mypy && uv run pytest -q
      - run: uv build
      - run: uv run python scripts/smoke_wheel.py
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.lock.txt && cyclonedx-py requirements requirements.lock.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-sbom
          path: packages/python/sbom.cdx.json
      # PyPI Trusted Publishing: no API token is stored; attestations are published with the files.
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: packages/python/dist
          attestations: true
