[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mercurifi"
version = "1.1.1"
description = "Python SDK for Mercurifi Agent Accounts on Arc"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "eth-account>=0.13.4,<0.14",
  "eth-abi>=5.1.0,<6",
  "eth-utils>=5.0.0,<6",
  "httpx>=0.28.1,<0.29",
]

[project.urls]
Homepage = "https://github.com/mercuri-finance/mercurifi-sdk"
Source = "https://github.com/mercuri-finance/mercurifi-sdk/tree/main/packages/python"
Issues = "https://github.com/mercuri-finance/mercurifi-sdk/issues"

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "mypy==1.15.0", "ruff==0.11.13", 'tomli==2.2.1; python_version < "3.11"']

[tool.hatch.build.targets.wheel]
packages = ["src/mercurifi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs scripts/local-chain.sh (loopback Anvil)"]
addopts = "-m 'not integration'"

[tool.mypy]
strict = true
files = ["src/mercurifi", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: the formatter sets the width; strings and comments it cannot wrap may run longer.
ignore = ["UP038", "E501"]
